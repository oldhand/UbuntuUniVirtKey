apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: {{ ceph_cluster_name }}
  namespace: {{ ceph_namespace }}
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  # 1. 全局调度配置（对所有组件生效）
  placement:
    # 所有组件的通用调度规则
    all:
      tolerations:
        # 容忍 master 节点污点（适用于 Kubernetes < 1.24）
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        # 容忍 control-plane 节点污点（适用于 Kubernetes >= 1.24）
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
  mon:
    count: 1
    allowMultiplePerNode: true
  dashboard:
    enabled: true
    ssl: true
  storage:
    useAllNodes: true
    useAllDevices: false
    config:
     # 使用目录而非物理磁盘
      osdsPerDevice: "1"
      databaseSizeMB: "1024"
      journalSizeMB: "1024"
    nodes:
{% for node in ceph_nodes %}
    - name: "{{ node.name }}"
      devices:
{% for dir in node.directories %}
        # 使用 API 支持的 fullpath 字段指定目录路径
        - name: "dir-{{ dir | replace('/', '-') }}"
          fullpath: "{{ dir }}"
{% endfor %}
      # 禁用自动设备发现，只使用我们指定的路径
      useAllDevices: false
{% endfor %}
  resources:
    mon:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
    osd:
      requests:
        cpu: "1000m"
        memory: "4Gi"
      limits:
        cpu: "2000m"
        memory: "8Gi"
  network:
    provider: host
  crashCollector:
    disable: false
  cleanupPolicy:
    confirmation: ""
# 单节点部署需禁用一些高可用配置
  mgr:
    count: 1
    allowMultiplePerNode: true